---
# Ansible inventory for YouTube Downloader deployment
#
# Copy this file to inventory.yml and update with your server details
# cp inventory.example.yml inventory.yml

all:
  children:
    media_automation:
      hosts:
        media-server:
          ansible_host: 10.71.20.30
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3

      vars:
        # Deployment settings
        download_dir: /mnt/media/media_services/youtube/YoutubeDownloads
        plex_url: http://10.71.1.35:32400
        plex_library_id: 14
        # plex_token: your_plex_token_here  # Set this in inventory.yml (not committed)
