[project]
name = "youtube-downloader"
version = "1.0.0"
description = "Automated YouTube channel downloader with Plex integration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
requires-python = ">=3.10"
keywords = ["youtube", "plex", "downloader", "media", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "Flask>=3.0.0",
    "Flask-HTTPAuth>=4.8.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "requests>=2.31",
    "click>=8.1.0",
]

[project.optional-dependencies]
plex = ["plexapi>=4.15.0"]
database = []  # Database support (currently built-in)
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
youtube-downloader = "youtube_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/youtube-downloader"
"Bug Tracker" = "https://github.com/yourusername/youtube-downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_downloader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
