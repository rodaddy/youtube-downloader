[project]
name = "youtube-downloader"
version = "1.0.0"
description = "Automated YouTube channel downloader with Plex integration"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
requires-python = ">=3.12"
keywords = ["youtube", "plex", "downloader", "media", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "Flask>=3.1.3",
    "Flask-HTTPAuth>=4.8.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "loguru>=0.7.3",
    "python-dotenv>=1.2.2",
    "apscheduler>=3.11",
    "requests>=2.33",
    "click>=8.3",
]

[project.optional-dependencies]
plex = ["plexapi>=4.18"]
database = []  # Database support (currently built-in)
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
    "mypy>=2.0",
]

[project.scripts]
youtube-downloader = "youtube_downloader.cli:main"

[project.urls]
Homepage = "https://github.com/rodaddy/youtube-downloader"
"Bug Tracker" = "https://github.com/rodaddy/youtube-downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_downloader"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
